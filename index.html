<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>RandomPass</title>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>RandomPass</h1>

      <div class="password-content">
        <input type="text" id="password" class="password js-password" />

        <button class="icon-button">
          <img src="./public/generator.png">
        </button>

        <button class="password-copy">
          Copy
        </button>
      </div>

      <div class="strength js-strength weak">
        <div class="strength-bar"></div>
        <span class="strength-text weak">weak</span>
        <span class="strength-text average">average</span>
        <span class="strength-text strong">strong</span>
      </div>

      <form class="options-content">
        <div class="option range">
          <label for="length">Password length</label>
          <input type="range" id="length" min="6" max="32" value="12" class="range input">
        </div>

        <fieldset class="checkbox-group">
          <legend class="legend">Include characters</legend>

          <label>
            <input type="checkbox" id="lowercase" checked>
            Lowercase letters
          </label>

          <label>
            <input type="checkbox" id="uppercase" checked>
            Uppercase letters
          </label>

          <label>
            <input type="checkbox" id="digits" checked>
            Digits
          </label>

          <label>
            <input type="checkbox" id="special">
            Special characters
          </label>
        </fieldset>
      </form>
    </section>
  </main>

  <script type="module" src="/src/renderer/renderer.ts"></script>
</body>

</html>
